name: Keepalive

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Commit keepalive state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update keepalive state
        run: |
          python scripts/update_keepalive.py --state state/keepalive.json

      - name: Commit keepalive state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/keepalive.json
          if git diff --cached --quiet; then
            echo "No keepalive changes to commit."
            exit 0
          fi
          git commit -m "Keepalive commit"
          git push
